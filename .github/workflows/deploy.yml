name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/marketly-org/payments-api:latest
            ghcr.io/marketly-org/payments-api:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=registry,ref=ghcr.io/marketly-org/payments-api:latest
          cache-to: type=inline

      - name: Update k8s manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|ghcr.io/marketly-org/payments-api:.*|ghcr.io/marketly-org/payments-api:sha-${{ steps.meta.outputs.sha }}|" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git commit -m "deploy: payments-api sha-${{ steps.meta.outputs.sha }}" || echo "no changes"
          git push
