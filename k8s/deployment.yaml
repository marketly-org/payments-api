apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: marketly
  labels:
    app: payments-api
    tier: api
  annotations:
    sentinel.io/repo: "marketly-org/payments-api"
    sentinel.io/branch: "main"
    sentinel.io/auto-merge: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payments-api
        tier: api
    spec:
      containers:
        - name: app
          image: ghcr.io/marketly-org/payments-api:sha-ed45653
          ports:
            - containerPort: 8080
          env:
            - name: PAYMENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marketly-db-credentials
                  key: payments-url
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marketly-secrets
                  key: stripe-api-key
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
